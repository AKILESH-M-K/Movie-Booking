<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Logo Icon Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <!-- Background Radial Lighting -->
    <radialGradient id="ambientRed" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientBlue" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1000" height="400" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="300" fill="url(#ambientRed)" />
  <circle cx="800" cy="200" r="300" fill="url(#ambientBlue)" />

  <!-- Subtle Decorative Grid Lines -->
  <line x1="0" y1="200" x2="1000" y2="200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <line x1="500" y1="0" x2="500" y2="400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- 2. Logo Mark & Branding Group -->
  <g id="LogoAndBrand" transform="translate(150, 100)">

    <!-- LOGO ICON: Film Reel / Play Button / Ticket Fusion -->
    <g id="Icon" transform="translate(0, 10)">
      <!-- Outer Hexagonal Badge with Glow -->
      <path d="M 90 0 L 160 40 L 160 120 L 90 160 L 20 120 L 20 40 Z" fill="url(#primaryGlow)" filter="url(#glow)" />
      
      <!-- Inner Dark Core -->
      <path d="M 90 8 L 152 44 L 152 116 L 90 152 L 28 116 L 28 44 Z" fill="#0f172a" opacity="0.9" />

      <!-- Film Reel Spool Slots -->
      <circle cx="90" cy="80" r="48" fill="none" stroke="url(#accentGlow)" stroke-width="4" stroke-dasharray="16 8" />
      <circle cx="90" cy="80" r="32" fill="#0f172a" stroke="#e11d48" stroke-width="2" />

      <!-- Centered Play Triangle Symbol -->
      <path d="M 82 66 L 106 80 L 82 94 Z" fill="#ffffff" filter="url(#glow)" />

      <!-- Ticket Notch Accents (Top/Bottom) -->
      <circle cx="90" cy="0" r="10" fill="#0b0f19" />
      <circle cx="90" cy="160" r="10" fill="#0b0f19" />
    </g>

    <!-- BRAND TEXT: CINEBOOK -->
    <g id="BrandName" transform="translate(210, 110)">
      
      <!-- Main Website Title -->
      <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="2">
        <tspan fill="#ffffff">CINE</tspan>
        <tspan fill="url(#textGrad)" filter="url(#glow)">BOOK</tspan>
      </text>

      <!-- Tagline / Descriptor -->
      <text x="5" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="8">
        CINEMA TICKETING PLATFORM
      </text>

      <!-- Decorative Accent Line -->
      <rect x="5" y="56" width="380" height="3" rx="1.5" fill="url(#textGrad)" opacity="0.8" />
    </g>

  </g>

  <!-- 3. Corner UI Badges / Sub-elements -->
  <g id="SubElements" transform="translate(680, 260)" opacity="0.85">
    <!-- Quick Feature Badge -->
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0" letter-spacing="0.5">LIVE BOOKING</text>
  </g>
</svg>
