<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Main Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- High Impact Glow Filter -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="100" fill="url(#bgGlow)" />

  <!-- LOGO MARK GROUP -->
  <g id="CineBookLogo" transform="translate(100, 100)" filter="url(#dropShadow)">
    
    <!-- Outer Glowing Badge Frame -->
    <rect x="0" y="0" width="300" height="300" rx="64" fill="url(#brandGrad)" filter="url(#superGlow)" />
    
    <!-- Inner Dark Core Plate -->
    <rect x="12" y="12" width="276" height="276" rx="52" fill="#0f172a" opacity="0.9" />

    <!-- TICKET STUB SIDE NOTCHES -->
    <circle cx="0" cy="150" r="28" fill="#0f172a" />
    <circle cx="300" cy="150" r="28" fill="#0f172a" />

    <!-- FILM REEL & CAMERA LENS RING -->
    <!-- Outer Spool Ring -->
    <circle cx="150" cy="150" r="80" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="28 14" filter="url(#superGlow)" />
    
    <!-- Inner Camera Lens Plate -->
    <circle cx="150" cy="150" r="50" fill="#1e293b" stroke="#f43f5e" stroke-width="3" />

    <!-- PLAY BUTTON CENTER SYMBOL -->
    <path d="M 140 126 L 174 150 L 140 174 Z" fill="#ffffff" filter="url(#superGlow)" />

    <!-- FILM STRIP PERFORATIONS (Top & Bottom Bands) -->
    <g fill="#ffffff" opacity="0.35">
      <!-- Top Perforations -->
      <rect x="60" y="32" width="20" height="14" rx="4" />
      <rect x="110" y="32" width="20" height="14" rx="4" />
      <rect x="160" y="32" width="20" height="14" rx="4" />
      <rect x="210" y="32" width="20" height="14" rx="4" />

      <!-- Bottom Perforations -->
      <rect x="60" y="254" width="20" height="14" rx="4" />
      <rect x="110" y="254" width="20" height="14" rx="4" />
      <rect x="160" y="254" width="20" height="14" rx="4" />
      <rect x="210" y="254" width="20" height="14" rx="4" />
    </g>

  </g>
</svg>
