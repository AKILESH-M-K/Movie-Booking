    <script>
      // GitHub Pages serves 404.html for deep links and passes the original
      // path in ?redirect=. Restore it so the SPA router sees the real URL.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        if (!redirect) return;
        var base = "/Movie-Booking/";
        var target = decodeURIComponent(redirect);
        // Only same-app paths are accepted; anything else falls back to home.
        if (target.charAt(0) !== "/" || target.indexOf("//") === 0) target = "/";
        var rest = target;
        while (rest.charAt(0) === "/") { rest = rest.slice(1); }
        var clean = target.indexOf(base) === 0 ? target : base + rest;
        window.history.replaceState(null, "", clean);
      })();
    </script>
