<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a4652a" />
    <meta name="description" content="CineBook movie ticket booking application" />

    <!-- Standard Favicons -->
    <link rel="icon" type="image/x-icon" href="/Movie-Booking/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/Movie-Booking/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/Movie-Booking/android-chrome-512x512.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/Movie-Booking/apple-touch-icon.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/Movie-Booking/site.webmanifest" />

    <title>CineBook - Movie Booking</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect");
      if (redirect) {
        const target = decodeURIComponent(redirect);
        const cleanTarget = target.startsWith("/Movie-Booking/")
          ? target
          : `/Movie-Booking/${target.replace(/^\/+/, "")}`;
        window.history.replaceState({}, "", cleanTarget);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
